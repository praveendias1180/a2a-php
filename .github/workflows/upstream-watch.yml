# Weekly: lists upstream A2A changes (Python SDK, spec, TCK) since our pins in
# ONE issue labelled "upstream", created or updated in place. See UPSTREAM.md.
name: Upstream watch

on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the issue body instead of writing the issue
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/upstream-watch.py --repo "${{ github.repository }}" ${{ inputs.dry_run && '--dry-run' || '' }} | tee -a "$GITHUB_STEP_SUMMARY"
