name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} (${{ matrix.deps }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        deps: [lowest, highest]
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
    env:
      # Runs the Laravel bridge's Redis Streams tests (skipped without it).
      A2A_TEST_REDIS: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: redis, pdo_sqlite
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.deps }}
      - run: vendor/bin/phpunit

  quality:
    name: Static analysis and style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: vendor/bin/phpstan analyse --no-progress
      - run: vendor/bin/php-cs-fixer fix --dry-run --diff

  python-interop:
    name: Interop with the Python SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - uses: ramsey/composer-install@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tests/Interop/python/requirements.txt
      - name: PHP client -> Python server, and Python client -> PHP server (JSON-RPC + HTTP+JSON)
        run: scripts/run-python-interop.sh
      - name: The A2A v0.3 SDK (a2a-sdk 0.3.x) in its own venv
        run: |
          python -m venv .venv-a2a-v03
          .venv-a2a-v03/bin/pip install -r tests/Interop/python/requirements-v03.txt
      - name: A2A v0.3 in both directions (PHP client -> v0.3 server, v0.3 client -> PHP server)
        run: A2A_PYTHON_V03="$PWD/.venv-a2a-v03/bin/python" scripts/run-python-interop-v03.sh

  tck:
    name: A2A TCK (JSON-RPC + HTTP+JSON)
    runs-on: ubuntu-latest
    env:
      # Pinned a2a-tck commit; bump deliberately (see UPSTREAM.md).
      A2A_TCK_REF: 263b9cfaf16a554bdfb166a7ba5b67716e946349
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite
          coverage: none
      - uses: ramsey/composer-install@v3
      - uses: actions/checkout@v4
        with:
          repository: a2aproject/a2a-tck
          ref: ${{ env.A2A_TCK_REF }}
          path: a2a-tck
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ./a2a-tck
      - name: PHP-FPM and nginx for the SUT
        # scripts/run-tck.sh starts its own unprivileged instances on 127.0.0.1;
        # the packages' system services are not used.
        run: |
          command -v php-fpm8.4 || sudo apt-get install -y --no-install-recommends php8.4-fpm
          command -v nginx || sudo apt-get install -y --no-install-recommends nginx-core
      - name: MUST level (must pass)
        run: A2A_TCK_DIR="$PWD/a2a-tck" scripts/run-tck.sh must
      - name: Keep the MUST report
        if: always()
        run: cp -r a2a-tck/reports tck-reports-must
      - name: SHOULD level (reported, not blocking)
        continue-on-error: true
        run: A2A_TCK_DIR="$PWD/a2a-tck" scripts/run-tck.sh should
      - name: Keep the SHOULD report
        if: always()
        run: cp -r a2a-tck/reports tck-reports-should || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tck-reports
          path: |
            tck-reports-must
            tck-reports-should

  tck-laravel:
    name: A2A TCK against a Laravel app (queued runner)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
    env:
      A2A_TCK_REF: 263b9cfaf16a554bdfb166a7ba5b67716e946349
      A2A_REDIS_HOST: 127.0.0.1
      A2A_REDIS_PORT: '6379'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: redis, pdo_sqlite
          coverage: none
      - uses: ramsey/composer-install@v3
      - uses: actions/checkout@v4
        with:
          repository: a2aproject/a2a-tck
          ref: ${{ env.A2A_TCK_REF }}
          path: a2a-tck
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ./a2a-tck
      - name: PHP-FPM and nginx for the Laravel app
        run: |
          command -v php-fpm8.4 || sudo apt-get install -y --no-install-recommends php8.4-fpm
          command -v nginx || sudo apt-get install -y --no-install-recommends nginx-core
      - name: MUST level (must pass)
        # Builds build/tck-laravel-app (composer create-project laravel/laravel) on first use.
        run: A2A_TCK_DIR="$PWD/a2a-tck" scripts/run-tck-laravel.sh must
      - name: Keep the MUST report
        if: always()
        run: cp -r a2a-tck/reports tck-laravel-reports-must || true
      - name: SHOULD level (reported, not blocking)
        continue-on-error: true
        run: A2A_TCK_DIR="$PWD/a2a-tck" scripts/run-tck-laravel.sh should
      - name: A 20 s task streams live from a queue worker and outlives its request
        run: scripts/run-tck-laravel.sh long-task
      - name: An A2A v0.3 client against the Laravel app (a2a.v0_3_compat)
        run: |
          python -m venv .venv-a2a-v03
          .venv-a2a-v03/bin/pip install -r tests/Interop/python/requirements-v03.txt
          A2A_PYTHON_V03="$PWD/.venv-a2a-v03/bin/python" scripts/run-tck-laravel.sh v03-interop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tck-laravel-reports
          path: tck-laravel-reports-must

  types-current:
    name: Generated types match a2a.proto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: buf generate
      - run: php scripts/generate-required-fields.php
      - name: Fail if src differs from a fresh generation
        run: |
          git status --porcelain generated
          git diff --exit-code generated
          test -z "$(git status --porcelain generated)"
