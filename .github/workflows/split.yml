# On every tag, publishes packages/laravel to the read-only repo
# praveendias1180/a2a-laravel (Packagist only reads a repo's root composer.json).
# The core package is this repo's root, so it needs no split.
# Needs a SPLIT_TOKEN secret: a fine-grained PAT with contents:write on a2a-laravel.
name: Split packages

on:
  push:
    tags: ['v*']

jobs:
  split:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - { dir: packages/laravel, repo: a2a-laravel }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: danharrin/monorepo-split-github-action@v2.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.SPLIT_TOKEN }}
        with:
          package_directory: ${{ matrix.package.dir }}
          repository_organization: praveendias1180
          repository_name: ${{ matrix.package.repo }}
          tag: ${{ github.ref_name }}
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
