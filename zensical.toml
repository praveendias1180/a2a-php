# Documentation site: https://praveendias1180.github.io/a2a-php/
# Build locally:  pip install zensical  &&  zensical serve
[project]
site_name = "A2A PHP SDK"
site_description = "PHP SDK for the A2A (Agent2Agent) protocol, in the same shape as the official Python SDK, with a Laravel bridge."
site_url = "https://praveendias1180.github.io/a2a-php/"
site_author = "Praveen Dias"
copyright = "Copyright &copy; 2026 Praveen Dias. Apache-2.0. Not affiliated with the A2A Project or the Linux Foundation."
repo_url = "https://github.com/praveendias1180/a2a-php"
repo_name = "praveendias1180/a2a-php"
edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "Get started" = [
    { "Install" = "get-started/install.md" },
    { "Your first agent" = "get-started/first-agent.md" },
    { "Call an agent" = "get-started/call-an-agent.md" },
  ] },
  { "Guides" = [
    { "Laravel: install and first agent" = "guides/laravel.md" },
    { "Laravel: queued execution" = "guides/laravel-queues.md" },
    { "Laravel: streaming behind nginx" = "guides/laravel-sse-nginx.md" },
    { "Laravel: storage and pruning" = "guides/laravel-storage.md" },
    { "Push notifications" = "guides/push-notifications.md" },
    { "Signing the Agent Card" = "guides/card-signing.md" },
    { "Extensions" = "guides/extensions.md" },
    { "A2A 0.3 agents and clients" = "guides/a2a-0-3.md" },
    { "Upgrading" = "guides/upgrading.md" },
  ] },
  { "Concepts" = [
    { "A2A in five minutes" = "concepts/a2a-in-five-minutes.md" },
    { "Running agents in PHP" = "concepts/running-agents-in-php.md" },
  ] },
  { "Reference" = [
    { "Python → PHP mapping" = "python-sdk-mapping.md" },
    { "Architecture" = "architecture.md" },
    { "API reference" = "reference/api.md" },
    { "Conformance" = "reference/conformance.md" },
    { "Backward compatibility" = "reference/backward-compatibility.md" },
    { "Performance" = "reference/performance.md" },
  ] },
  { "Project" = [
    { "Roadmap" = "project/roadmap.md" },
    { "Changelog" = "project/changelog.md" },
    { "Contributing" = "project/contributing.md" },
    { "Security" = "project/security.md" },
  ] },
]

[project.theme]
language = "en"
favicon = "assets/favicon.svg"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[project.theme.icon]
logo = "lucide/network"
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.extra]
social = [
  { icon = "fontawesome/brands/github", link = "https://github.com/praveendias1180/a2a-php" },
]

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.highlight.extend_pygments_lang = [
  # Let ```php blocks start without "<?php".
  { name = "php", lang = "php", options = { startinline = true } },
]
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
# Code samples are included from real files (examples/, CHANGELOG.md, ...), so
# the docs show exactly what CI runs. Paths are relative to the repo root.
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
